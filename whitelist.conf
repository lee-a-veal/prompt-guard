# prompt-guard whitelist
# Suppress known-benign scanner hits on a per-signal-evidence basis.
#
# Format:  signal_id: text_pattern
#   signal_id    — exact match against a signal's "id" field
#   text_pattern — case-insensitive substring match against the signal's "evidence" field
#
# A signal is suppressed only when BOTH its id and evidence match an entry.
# Multiple entries with the same signal_id are OR'd.
#
# To find evidence text for a false positive:
#   python3 -m promptguard.scan --pretty <file>
# Look at the "evidence" field of the signal you want to suppress.
#
# 2026-07-01: pruned ~75 embedded_command entries after the scanner pattern was
# fixed to require corroborating context (pipe-to-shell, destructive literal,
# or reader-directed imperative) instead of firing on bare verbs like "run".
# Entries below are re-verified against the new pattern.

# prompt-guard's own source files (scan.py contains injection keywords as regex source)
instruction_override: attempt to discard prior instructions/context
role_reassignment: you are now|from now on,? you
system_prompt_probe: system prompt|your (instructions|guid
embedded_command: r"(\b(curl|wget)
urgency_authority: low scores pass silently

# normalize.py — obfuscation detection tables contain literal homoglyphs and invisible-char sequences
# counts reflect the current file; update if detection tables change significantly
invisible_chars: 15 invisible characters stripped
homoglyphs: 55 homoglyphs folded

# settings.json — the destructive-command PreToolUse hook carries its detection
# pattern as a literal, so scanning settings.json re-triggers the detector.
# 2026-08-07: the hook was rewritten from a `grep -qE ...` shell one-liner to a
# stdin-reading Python guard (the shell form silently no-op'd under ugrep, and
# read a $CLAUDE_TOOL_INPUT var that is never set). That changed the evidence
# window, orphaning the old `grep -qe ...` entry and leaving settings.json as an
# unsuppressed 32/100 MEDIUM false positive. Re-anchored to the new call site.
embedded_command: m=re.search(r

# trading — DJSC ({"ai":{...}}) design-intent comments, 168 across master-scripts/.
# Spec: github.com/losts1/dense-json-style-comments. Measured 2026-08-26: 7 of the
# 168 trip the scanner, all from TRADING VOCABULARY colliding with injection
# patterns — "cancel all orders" reads as instruction_override, "fetch auth token"
# as exfiltration.
#
# DELIBERATELY NOT whitelisted: the DJSC wrapper itself. whitelist.conf has no
# path scoping (_parse_raw yields (signal_id, pattern) only), so an entry keyed on
# `{"ai":{"goal"` would suppress the signal for content from ANY source. DJSC is a
# published public spec for agent-directed instructions, which makes it precisely
# the envelope an attacker would adopt. Each entry below therefore names its own
# specific benign phrase; a DJSC block with different contents still scores.
exfiltration: fetch a kraken ws auth token
# NB: patterns must fit INSIDE the evidence truncation window — the full
# '_get_auth_token' overruns it and never matches.
exfiltration: fetch auth token via _get_auth_tok
